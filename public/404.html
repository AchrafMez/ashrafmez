<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Achraf Meziouni</title>
    <!-- Matches the site's page colour so the bounce never flashes white. -->
    <style>
      html {
        background-color: #0a0a0a;
        color-scheme: dark;
      }
    </style>
    <script>
      // GitHub Pages serves this for any unknown path. Stash the requested
      // route and bounce to the SPA entry, which restores it from sessionStorage.
      sessionStorage.setItem(
        "spa:redirect",
        location.pathname + location.search + location.hash
      );
      location.replace("/");
    </script>
  </head>
  <body></body>
</html>
